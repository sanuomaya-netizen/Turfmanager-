<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turf Manager</title>
<style>
:root{--bg:#eef5ea;--sf:#fff;--tx:#14301a;--mu:#55695a;--ac:#2e7d32;--ac2:#dcefd7;--bd:#cfdecb;--bad:#c62828;--warn:#f9a825;--fs:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a11;--sf:#172318;--tx:#e9f3e7;--mu:#9db3a0;--ac:#6fcf73;--ac2:#213a24;--bd:#2c3f2e;--bad:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota",system-ui,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:10px 12px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:1.15rem;margin:4px 0;display:flex;gap:8px;align-items:center}
.tools{display:flex;gap:6px}
.tools select,.tools button{width:auto;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-size:.9rem}
section{display:none}
section.on{display:block}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.ttl{font-size:1.15rem;font-weight:700;margin:0 0 6px;display:flex;gap:8px;align-items:center}
label{display:block;font-size:.9rem;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:1.05rem;margin-top:14px;cursor:pointer}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.card{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:1rem}
.big{font-size:1.35rem;font-weight:800}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.mu,small{color:var(--mu)}
.x{background:none;border:0;font-size:1.5rem;cursor:pointer;padding:4px 8px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--ac2);font-size:.8rem;margin:2px 4px 2px 0}
.tag.bad{background:var(--bad);color:#fff}
.bar{height:12px;border-radius:8px;background:var(--ac2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ac)}
details{border:1px solid var(--bd);border-radius:14px;margin-top:10px;background:var(--bg)}
summary{padding:14px;cursor:pointer;font-weight:700;font-size:1.05rem}
details>div{padding:0 14px 14px}
a{color:var(--ac);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));z-index:10;overflow-x:auto}
.tabs button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--mu);font:inherit;font-size:.6rem;padding:4px 1px;border-radius:12px;cursor:pointer;overflow:hidden;white-space:nowrap}
.tabs button b{display:block;height:30px;line-height:1;font-weight:400}.tabs button b svg{display:block;margin:0 auto}
.tabs button.on{background:var(--ac2);color:var(--ac);font-weight:700}
.me{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:6px auto 10px;border:4px solid var(--ac2)}
.who{text-align:center;font-size:1.2rem;font-weight:800;margin:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad button{padding:14px 0;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;font-size:1.2rem;cursor:pointer}
.pad .op{background:var(--ac2);color:var(--ac);font-weight:700}
#c-disp{text-align:right;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);overflow-x:auto;min-height:3rem}
.wx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wd{flex:0 0 96px;text-align:center;border:1px solid var(--bd);border-radius:14px;padding:8px 4px;background:var(--bg)}
.wd .e{font-size:2.2rem;line-height:1.2}
.chatbox{height:46vh;min-height:240px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:8px;margin-top:8px}
.msg{max-width:86%;margin:6px 0;padding:8px 10px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);word-wrap:break-word;overflow-wrap:anywhere;font-size:.95rem}
.msg.me{margin-left:auto;background:var(--ac2)}
.msg small{display:block;color:var(--mu);font-size:.72rem}
.chatin{display:flex;gap:8px;margin-top:8px}.chatin input{flex:1}
.sendb{border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:1.2rem;padding:0 18px;cursor:pointer}
.sendb:disabled{opacity:.45}
.btn.red{background:var(--bad)}
.alert{border-radius:14px;padding:12px;margin-top:10px;font-weight:700;background:var(--ac2)}
.alert.w{background:var(--warn);color:#222}
</style>
</head>
<body>
<main>
<header>
<h1><span>🌱</span><span data-i="title"></span> <small style="font-size:.7rem;background:#2e7d32;color:#fff;border-radius:8px;padding:1px 7px">v9</small></h1>
<div class="tools"><button id="fs" aria-label="Text size">🔠</button><select id="lang"><option value="0">සිංහල</option><option value="1">English</option><option value="2">தமிழ்</option></select></div>
</header>

<!-- HOME -->
<section id="s0">
<div class="panel">
<div class="ttl">📐 <span data-i="area"></span></div>
<div class="row"><div><label>🌿 <span data-i="m"></span> (<span data-i="sqft"></span>)</label><input type="number" inputmode="decimal" id="areaM" min="0"></div><div><label>🍀 <span data-i="a"></span> (<span data-i="sqft"></span>)</label><input type="number" inputmode="decimal" id="areaA" min="0"></div></div>
</div>
<div id="sum"></div>
<div class="panel"><div class="ttl">📊 <span data-i="breakdown"></span></div><div id="brk"></div></div>
</section>

<!-- MONEY -->
<section id="s1">
<details><summary>🧮 <span data-i="calc"></span></summary><div>
<div id="c-disp" class="big">0</div>
<div class="pad">
<button data-a="calc" data-v="7">7</button><button data-a="calc" data-v="8">8</button><button data-a="calc" data-v="9">9</button><button data-a="calc" data-v="/" class="op">÷</button>
<button data-a="calc" data-v="4">4</button><button data-a="calc" data-v="5">5</button><button data-a="calc" data-v="6">6</button><button data-a="calc" data-v="*" class="op">×</button>
<button data-a="calc" data-v="1">1</button><button data-a="calc" data-v="2">2</button><button data-a="calc" data-v="3">3</button><button data-a="calc" data-v="-" class="op">−</button>
<button data-a="calc" data-v="0">0</button><button data-a="calc" data-v=".">.</button><button data-a="calc" data-v="C" class="op">C</button><button data-a="calc" data-v="+" class="op">+</button>
<button data-a="calc" data-v="=" class="op" style="grid-column:span 2">=</button>
<button data-a="calc" data-v="use" style="grid-column:span 2;background:var(--ac);color:#fff;font-size:1rem">✅ <span data-i="useAmt"></span></button>
</div></div></details>

<div class="panel">
<div class="ttl">💰 <span data-i="addRec"></span></div>
<div class="row"><div><label>📅 <span data-i="date"></span></label><input type="date" id="r-d"></div><div><label>↕️ <span data-i="kind"></span></label><select id="r-k"></select></div></div>
<div class="row"><div><label>🌿 <span data-i="grass"></span></label><select id="r-t"></select></div><div><label>🏷️ <span data-i="cat"></span></label><select id="r-c"></select></div></div>
<div class="row"><div><label>💰 <span data-i="amt"></span></label><input type="number" inputmode="decimal" id="r-a" min="0"></div><div><label>📝 <span data-i="note"></span></label><input id="r-n"></div></div>
<button class="btn" data-a="addR">➕ <span data-i="add"></span></button>
</div>
<div id="r-list"></div>
</section>

<!-- FERT -->
<section id="s2">
<div class="panel">
<div class="ttl">🧪 <span data-i="fertTitle"></span></div>
<div class="row"><div><label>📅 <span data-i="date"></span></label><input type="date" id="f-d"></div><div><label>🌿 <span data-i="grass"></span></label><select id="f-t"></select></div></div>
<div class="row"><div><label>🧴 <span data-i="fname"></span></label><input id="f-n"></div><div><label>⏱️ <span data-i="interval"></span></label><input type="number" inputmode="numeric" id="f-i" value="45" min="1"></div></div>
<button class="btn" data-a="addF">➕ <span data-i="add"></span></button>
</div>
<div id="f-list"></div>
</section>

<!-- DISEASE -->
<section id="s3"><div class="panel"><p class="mu" data-i="disNote"></p><div id="dis"></div></div></section>

<!-- WEATHER -->
<section id="s4">
<div class="panel">
<div class="ttl">🌦️ <span data-i="wxTitle"></span></div>
<label>📍 <span data-i="district"></span></label><select id="w-d"></select>
<div id="wx-box"><p class="mu" data-i="loading"></p></div>
<p><a href="https://www.meteo.gov.lk" target="_blank" rel="noopener">🌐 meteo.gov.lk</a></p>
</div>
</section>

<!-- MARKET -->
<section id="s5">
<div class="panel">
<p class="mu" data-i="mkInfo"></p>
<div id="mk-form">
<div class="row"><div><label>🌿 <span data-i="grass"></span></label><select id="m-t"></select></div><div><label>💰 <span data-i="price"></span></label><input type="number" inputmode="decimal" id="m-p" min="0"></div></div>
<div class="row"><div><label>📦 <span data-i="qty"></span></label><input type="number" inputmode="decimal" id="m-q" min="0"></div><div><label>📍 <span data-i="dist"></span></label><input id="m-d"></div></div>
<div class="row"><div><label>👤 <span data-i="sname"></span></label><input id="m-n"></div><div><label>📞 <span data-i="phone"></span></label><input id="m-ph" type="tel" inputmode="tel"></div></div>
<label>📝 <span data-i="note"></span></label><input id="m-no">
<button class="btn" data-a="post">📢 <span data-i="post"></span></button>
</div>
<p class="mu" id="mk-msg"></p>
</div>
<div class="row"><div><select id="m-f"></select></div><div><input id="m-s"></div></div>
<div id="mk-list"></div>
</section>

<!-- INFO -->
<section id="s6">
<div class="panel">
<div class="ttl">💬 <span data-i="chatT"></span></div>
<select id="c-room"></select>
<p class="mu" id="c-msg" style="margin:6px 0 0"></p>
<div class="chatbox" id="c-box"></div>
<div class="chatin"><input id="c-in" maxlength="500" autocomplete="off"><button class="sendb" id="c-send" aria-label="send">➤</button></div>
<p class="mu" style="font-size:.8rem" data-i="chatRules"></p>
</div>
</section>

<section id="s7">
<div class="panel">
<div class="ttl">👤 <span data-i="profT"></span></div>
<label><span data-i="pname"></span></label><input id="p-n" maxlength="40" autocomplete="off">
<label>📞 <span data-i="pphone"></span></label><input id="p-ph" type="tel" inputmode="tel" maxlength="20">
<label>📍 <span data-i="pdist"></span></label><select id="p-d"></select>
<button class="btn" id="p-save">💾 <span data-i="psave"></span></button>
<p class="mu" id="p-msg" style="margin:8px 0 0"></p>
<p class="mu" style="font-size:.85rem" data-i="privNote"></p>
<button class="btn red" id="p-del">🗑️ <span data-i="pdel"></span></button>
</div>
<div class="panel">
<img class="me" alt="W. Suranga Chaminda" src="me.jpg">
<p class="who">W. Suranga Chaminda</p>
<p class="mu" style="text-align:center">👨‍🌾 <span data-i="role"></span></p>
</div>
<div class="panel"><div class="ttl">⚠️ <span data-i="discTitle"></span></div><p data-i="disc"></p></div>
</section>
</main>

/* ===== calculator ===== */
const C={cur:"0",acc:null,op:null,fresh:true};
const cA=(a,o,b)=>o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:(b===0?0:a/b),cF=n=>String(+n.toFixed(6));
function calc(v){
if(/^[0-9]$/.test(v)){C.cur=C.fresh||C.cur==="0"?v:C.cur+v;C.fresh=false}
else if(v==="."){if(C.fresh){C.cur="0.";C.fresh=false}else if(!C.cur.includes("."))C.cur+="."}
else if(v==="C"){C.cur="0";C.acc=null;C.op=null;C.fresh=true}
else if(v==="="){if(C.op!==null){C.cur=cF(cA(C.acc,C.op,parseFloat(C.cur)));C.acc=null;C.op=null;C.fresh=true}}
else if(v==="use"){const n=parseFloat(C.cur);if(n>0)$("r-a").value=n}
else{if(C.op!==null&&!C.fresh){C.acc=cA(C.acc,C.op,parseFloat(C.cur));C.cur=cF(C.acc)}else C.acc=parseFloat(C.cur);C.op=v;C.fresh=true}
$("c-disp").textContent=C.cur}

const q=$("m-s").value.trim().toLowerCase(),f=$("m-f").value;
const L=MK.filter(i=>(!f||i.t===f)&&(!q||((i.d||"")+" "+(i.n||"")).toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);
$("mk-list").innerHTML=L.length?L.map(i=>`<div class="card item"><div><b>${ic(i.t)}</b> <span class="tag">${money(i.p)} / ${t("sqft")}</span><br>📦 ${Number(i.q).toLocaleString("en-US")} ${t("sqft")}<br>📍 ${esc(i.d)}<br>👤 ${esc(i.n||"")}<br>📞 <a href="tel:${esc(i.ph)}">${esc(i.ph)}</a>${i.no?"<br><small>"+esc(i.no)+"</small>":""}</div>${(mine.includes(i.key)||(i.uid&&i.uid===myUid()))?`<button class="x" data-a="delL" data-v="${esc(i.key)}">🗑️</button>`:""}</div>`).join(""):(on?`<div class="card mu">${t("none")}</div>`:"")}
async function postL(){
const p=+$("m-p").value,q=+$("m-q").value,d=$("m-d").value.trim(),ph=$("m-ph").value.trim();
if(!(p>0&&q>0&&d&&ph)){$("mk-msg").textContent=t("mkReq");return}
const it={t:$("m-t").value,p,q,d,n:$("m-n").value.trim(),ph,no:$("m-no").value.trim(),ts:Date.now()};
try{const a=await getAuth();it.uid=a.uid;const j=await fbq("/listings.json","POST",it);if(!j||!j.name)throw 0;mine.push(j.name);sv("tf_mine",mine);$("m-q").value=$("m-p").value=$("m-no").value="";$("mk-msg").textContent=t("posted");loadMk()}catch(e){$("mk-msg").textContent=t("mkErr")}}
async function delL(k){try{await fbq("/listings/"+k+".json","DELETE");mine=mine.filter(x=>x!==k);sv("tf_mine",mine);loadMk()}catch(e){$("mk-msg").textContent=t("mkErr")}}

/* ===== accounts (Firebase anonymous auth) & chat ===== */
function FBON(){return !!(FB_URL&&FB_KEY)}
var AUTH=ld("tf_auth",null);
var PROF=ld("tf_prof",{name:"",phone:"",dist:0});
function myUid(){return (AUTH&&AUTH.uid)||""}
function authReq(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()})}
function getAuth(){
if(!FBON())return Promise.reject(new Error("off"));
if(AUTH&&AUTH.tok&&AUTH.exp>Date.now()+60000)return Promise.resolve(AUTH);
var p;
if(AUTH&&AUTH.rt){p=authReq("https://securetoken.googleapis.com/v1/token?key="+FB_KEY,{grant_type:"refresh_token",refresh_token:AUTH.rt}).then(function(j){if(!j.id_token)throw new Error("refresh");return{rt:j.refresh_token,uid:j.user_id,tok:j.id_token,exp:Date.now()+(+j.expires_in)*1000}})}
else{p=authReq("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_KEY,{returnSecureToken:true}).then(function(j){if(!j.idToken)throw new Error("signup");return{rt:j.refreshToken,uid:j.localId,tok:j.idToken,exp:Date.now()+(+j.expiresIn)*1000}})}
return p.then(function(a){AUTH=a;sv("tf_auth",a);return a})}
function fbq(path,method,body){return getAuth().then(function(a){
var u=FB_URL+path+(path.indexOf("?")<0?"?":"&")+"auth="+encodeURIComponent(a.tok);
var o={method:method||"GET"};if(body!==undefined)o.body=JSON.stringify(body);
return fetch(u,o).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})})}

function fillProf(){$("p-n").value=PROF.name||"";$("p-ph").value=PROF.phone||"";$("p-d").value=PROF.dist||0}
function saveProf(){
var n=$("p-n").value.trim();if(!n){$("p-msg").textContent=t("needName");return}
PROF={name:n,phone:$("p-ph").value.trim(),dist:+$("p-d").value||0};sv("tf_prof",PROF);
if(!FBON()){$("p-msg").textContent=t("psaved");return}
getAuth().then(function(a){return Promise.all([fbq("/profiles/"+a.uid+".json","PUT",{name:PROF.name,dist:PROF.dist}),fbq("/users/"+a.uid+".json","PUT",{phone:PROF.phone,created:Date.now()})])}).then(function(){$("p-msg").textContent=t("psaved")},function(){$("p-msg").textContent=t("mkErr")})}
function delProf(){
if(!confirm(t("pdelC")))return;
var done=function(){PROF={name:"",phone:"",dist:0};sv("tf_prof",PROF);AUTH=null;sv("tf_auth",null);mine=[];sv("tf_mine",mine);fillProf();$("p-msg").textContent=t("pdeleted")};
if(!FBON()||!myUid()){done();return}
var u=myUid();
Promise.all([fbq("/profiles/"+u+".json","DELETE"),fbq("/users/"+u+".json","DELETE")]).then(function(){return getAuth()}).then(function(a){return authReq("https://identitytoolkit.googleapis.com/v1/accounts:delete?key="+FB_KEY,{idToken:a.tok})}).then(done,function(){$("p-msg").textContent=t("mkErr")})}

var room="all",cTimer=null,cLast="",lastSend=0;
function roomPath(){return room==="all"?"all":"d"+(PROF.dist||0)}
function buildRooms(){keep("c-room",'<option value="all">🌍 '+t("roomAll")+'</option><option value="d">📍 '+t("roomDist")+' ('+WD[PROF.dist||0][LI]+')</option>');$("c-room").value=room}
function chatOpen(){
buildRooms();
var off=!FBON(),np=!PROF.name;
$("c-msg").textContent=off?t("chatOff"):np?t("needProf"):"";
$("c-in").disabled=$("c-send").disabled=(off||np);
if(off)return;
chatLoad();if(!cTimer)cTimer=setInterval(chatLoad,5000)}
function chatClose(){if(cTimer){clearInterval(cTimer);cTimer=null}}
function chatLoad(){
fbq("/chat/"+roomPath()+".json?orderBy=%22%24key%22&limitToLast=60","GET").then(function(j){
j=j||{};var arr=Object.keys(j).sort().map(function(k){return j[k]});
var sig=roomPath()+":"+arr.length+":"+(arr.length?arr[arr.length-1].ts:0);if(sig===cLast)return;cLast=sig;
var box=$("c-box"),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
box.innerHTML=arr.length?arr.map(function(m){var d=new Date(m.ts),hh=pad(d.getHours())+":"+pad(d.getMinutes());return '<div class="msg'+(m.uid===myUid()?" me":"")+'"><small>'+esc(m.name||"")+' · '+hh+'</small>'+esc(m.text||"")+'</div>'}).join(""):'<p class="mu">'+t("none")+'</p>';
if(near||!box.getAttribute("d")){box.scrollTop=box.scrollHeight;box.setAttribute("d","1")}
$("c-msg").textContent=PROF.name?"":t("needProf")
}).catch(function(){$("c-msg").textContent=t("mkErr")})}
function chatSend(){
var tx=$("c-in").value.trim();if(!tx||!PROF.name)return;
if(Date.now()-lastSend<2000)return;lastSend=Date.now();
var m={uid:"",name:PROF.name,text:tx.slice(0,500),ts:Date.now()};
getAuth().then(function(a){m.uid=a.uid;return fbq("/chat/"+roomPath()+".json","POST",m)}).then(function(){$("c-in").value="";cLast="";chatLoad()},function(){$("c-msg").textContent=t("mkErr")})}
$("c-send").onclick=chatSend;
$("c-in").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();chatSend()}};
$("c-room").onchange=function(e){room=e.target.value;cLast="";$("c-box").removeAttribute("d");chatLoad()};
$("p-save").onclick=saveProf;$("p-del").onclick=delProf;

/* ===== events ===== */
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const v=el.dataset.v;
const H=({show:()=>show(+v),addR,addF,calc:()=>calc(v),post:postL,
delR:()=>{recs=recs.filter(x=>x.id!==+v);sv("tf_recs",recs);renderData()},
delF:()=>{ferts=ferts.filter(x=>x.id!==+v);sv("tf_ferts",ferts);renderData()},
delL:()=>delL(v)});const fn=H[el.dataset.a];if(fn)fn()});
$("lang").onchange=e=>{LI=+e.target.value;sv("tf_lang",LI);applyLang()};
$("r-k").onchange=()=>keep("r-c",opts($("r-k").value==="i"?CATI:CATE,ic));
$("areaM").oninput=e=>{area.m=+e.target.value||0;sv("tf_area",area);renderData()};
$("areaA").oninput=e=>{area.a=+e.target.value||0;sv("tf_area",area);renderData()};
$("w-d").onchange=e=>{wxD=+e.target.value;sv("tf_wd",wxD);loadWx()};
$("m-f").onchange=mkRender;$("m-s").oninput=mkRender;
const FS=[17,20,23];
function setFs(){document.documentElement.style.setProperty("--fs",FS[fsz]+"px")}
$("fs").onclick=()=>{fsz=(fsz+1)%3;sv("tf_fs",fsz);setFs()};
setFs();
$("r-d").value=$("f-d").value=today();
applyLang();fillProf();show(0);
</script>
